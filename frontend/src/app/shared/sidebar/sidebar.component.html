<nav class="h-screen w-56 flex flex-col border-r border-slate-200 bg-slate-100">
    <div class="flex items-center gap-2.5 px-4 py-5">
        <div class="flex h-7 w-7 items-center justify-center rounded-lg bg-indigo-700">
            <app-icon [name]="'package'" class="text-white"></app-icon>
        </div>
        <span class="text-xl font-medium">Inventory</span>
    </div>

    <div class="flex flex-col gap-0.5 px-2 border-t border-slate-200 py-3">
        @for (item of sidebarItems(); track item.path) {
            <div [routerLink]="item.path" routerLinkActive="bg-indigo-100 text-indigo-700" class="flex cursor-pointer items-center gap-2.5 rounded-lg px-2.5 py-2 text-slate-500 ">
                <app-icon [name]="item.icon"></app-icon>
                <span class="text-sm">{{ item.label }}</span>
            </div>
        }
    </div>

    <div class="mt-auto border-t border-slate-200 px-2 py-3">
        <div class="flex items-center gap-2.5 rounded-lg px-2.5 py-2 cursor-pointer hover:bg-slate-50">
            <app-initial [firstName]="AuthUtils.firstName()" [lastName]="AuthUtils.lastName()"/>
            <div>
                <div class="text-sm font-medium">{{ AuthUtils.firstName() + ' ' + AuthUtils.lastName() }}</div>
            </div>
        </div>
    </div>
</nav>
