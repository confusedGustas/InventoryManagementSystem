<div class="pointer-events-none fixed right-4 top-4 z-[100] flex w-full max-w-sm flex-col gap-3">
    @for (toast of toastService.toasts(); track toast.id) {
        <div
            class="pointer-events-auto overflow-hidden rounded-2xl border shadow-[0_18px_40px_-24px_rgba(15,23,42,0.45)] backdrop-blur"
            [class.border-emerald-200]="toast.type === 'success'"
            [class.bg-emerald-50/95]="toast.type === 'success'"
            [class.border-red-200]="toast.type === 'error'"
            [class.bg-red-50/95]="toast.type === 'error'">
            <div class="flex items-start gap-3 px-4 py-4">
                <div
                    class="mt-0.5 h-2.5 w-2.5 rounded-full"
                    [class.bg-emerald-500]="toast.type === 'success'"
                    [class.bg-red-500]="toast.type === 'error'"></div>

                <div class="min-w-0 flex-1">
                    <p
                        class="text-sm font-medium"
                        [class.text-emerald-900]="toast.type === 'success'"
                        [class.text-red-900]="toast.type === 'error'">
                        {{ toast.message }}
                    </p>
                </div>

                <button
                    type="button"
                    class="text-xs font-semibold uppercase tracking-[0.2em] text-slate-400 transition hover:text-slate-600"
                    (click)="dismiss(toast.id)">
                    Close
                </button>
            </div>
        </div>
    }
</div>
