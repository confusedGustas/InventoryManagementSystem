<article class="rounded-lg border border-slate-200 bg-white p-6">
    <div class="text-base font-semibold text-slate-900">Category Breakdown</div>
    <div class="mt-1 text-sm text-slate-500">Which item categories hold the most stock.</div>

    <div class="mt-5 space-y-3">
        @for (category of categories(); track category.category) {
            <div class="rounded-lg border border-slate-100 bg-slate-50 px-4 py-3">
                <div class="flex items-center justify-between gap-4">
                    <div class="font-medium text-slate-900">{{ category.category }}</div>
                    <div class="text-sm text-slate-500">{{ category.itemCount }} items</div>
                </div>
                <div class="mt-2 h-2 overflow-hidden rounded-full bg-slate-200">
                    <div class="h-full rounded-full bg-indigo-700" [style.width.%]="category.totalQuantity * 100 / (categories()[0]?.totalQuantity || 1)"></div>
                </div>
                <div class="mt-2 text-sm text-slate-500">{{ category.totalQuantity }} total quantity</div>
            </div>
        }
    </div>
</article>
