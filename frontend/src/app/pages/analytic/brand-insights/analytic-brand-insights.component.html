<section class="rounded-lg border border-slate-200 bg-white p-4 sm:p-6">
    <div class="flex flex-col gap-1">
        <h2 class="text-lg font-semibold text-slate-900">Brand Breakdown</h2>
        <p class="text-sm text-slate-500">Top brands by tracked quantity in the current scope.</p>
    </div>

    <div class="mt-5 overflow-x-auto">
        <table class="min-w-full text-left text-sm text-slate-600">
            <thead class="border-b border-slate-200 text-xs font-semibold uppercase tracking-[0.16em] text-slate-400">
                <tr>
                    <th class="px-4 py-3 whitespace-nowrap">Brand</th>
                    <th class="px-4 py-3 whitespace-nowrap">Items</th>
                    <th class="px-4 py-3 whitespace-nowrap">Quantity</th>
                    <th class="px-4 py-3 whitespace-nowrap">Avg / Item</th>
                </tr>
            </thead>
            <tbody>
                @for (brand of brands(); track brand.brand) {
                    <tr class="border-b border-slate-100 last:border-0">
                        <td class="px-4 py-3 font-medium text-slate-900">{{ brand.brand }}</td>
                        <td class="px-4 py-3">{{ brand.itemCount }}</td>
                        <td class="px-4 py-3">{{ brand.totalQuantity }}</td>
                        <td class="px-4 py-3">{{ brand.averageQuantity | number:'1.0-1' }}</td>
                    </tr>
                }
            </tbody>
        </table>
    </div>
</section>
