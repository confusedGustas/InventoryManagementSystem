<section class="rounded-lg border border-slate-200 bg-white p-4 sm:p-6">
    <div class="flex flex-col gap-1">
        <h2 class="text-lg font-semibold text-slate-900">Stock Health</h2>
        <p class="text-sm text-slate-500">Quick view of stock pressure across the selected scope.</p>
    </div>

    <div class="mt-5 grid gap-4 sm:grid-cols-3">
        @for (entry of pagedStockHealth(); track entry.status) {
            <article class="rounded-lg border border-slate-200 bg-slate-50 p-4">
                <div class="text-xs font-semibold uppercase tracking-[0.14em] text-slate-400">{{ entry.status }}</div>
                <div class="mt-3 text-2xl font-semibold text-slate-900">{{ entry.itemCount }}</div>
                <div class="mt-2 text-sm text-slate-500">{{ entry.totalQuantity }} units</div>
            </article>
        }
    </div>

    <app-list-pagination [page]="page()" [totalPages]="totalPages()" (pageChanged)="goToPage($event)" />
</section>
