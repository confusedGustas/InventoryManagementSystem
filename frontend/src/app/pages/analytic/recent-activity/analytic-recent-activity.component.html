<section class="rounded-lg border border-slate-200 bg-white p-4 sm:p-6">
    <div class="flex flex-col gap-1">
        <h2 class="text-lg font-semibold text-slate-900">Recent Activity</h2>
        <p class="text-sm text-slate-500">Monthly item creation trend based on the existing data.</p>
    </div>

    <div class="mt-5 overflow-x-auto">
        <table class="min-w-full text-left text-sm text-slate-600">
            <thead class="border-b border-slate-200 text-xs font-semibold uppercase tracking-[0.16em] text-slate-400">
                <tr>
                    <th class="px-4 py-3 whitespace-nowrap">Period</th>
                    <th class="px-4 py-3 whitespace-nowrap">Items Added</th>
                    <th class="px-4 py-3 whitespace-nowrap">Quantity Added</th>
                </tr>
            </thead>
            <tbody>
                @for (entry of activity(); track entry.period) {
                    <tr class="border-b border-slate-100 last:border-0">
                        <td class="px-4 py-3 font-medium text-slate-900">{{ entry.period }}</td>
                        <td class="px-4 py-3">{{ entry.itemsAdded }}</td>
                        <td class="px-4 py-3">{{ entry.quantityAdded }}</td>
                    </tr>
                }
            </tbody>
        </table>
    </div>
</section>
