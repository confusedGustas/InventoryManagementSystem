@if (isPlatformAdmin()) {
    <label class="block min-w-64">
        <span class="mb-1.5 block text-sm font-medium text-slate-700">Company Scope</span>
        <div class="relative">
            <select class="w-full appearance-none rounded-lg border border-slate-300 bg-white px-3 py-2 pr-10 text-sm text-slate-900 outline-none transition focus:border-indigo-700 focus:ring-2 focus:ring-slate-100"
                    [value]="selectedCompanyId() ?? ''"
                    (change)="companySelected.emit($any($event.target).value || null)">
                <option value="">All companies</option>
                @for (company of companies(); track company.id) {
                    <option [value]="company.id">{{ company.name }}</option>
                }
            </select>
            <span class="pointer-events-none absolute inset-y-0 right-3 flex items-center text-slate-400">
                <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 0 1 1.06.02L10 11.168l3.71-3.938a.75.75 0 1 1 1.08 1.04l-4.25 4.512a.75.75 0 0 1-1.08 0L5.21 8.27a.75.75 0 0 1 .02-1.06Z" clip-rule="evenodd" /></svg>
            </span>
        </div>
    </label>
}
