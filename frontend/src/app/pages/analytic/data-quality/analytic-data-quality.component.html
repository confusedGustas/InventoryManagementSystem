<section class="rounded-lg border border-slate-200 bg-white p-4 sm:p-6">
    <div class="flex flex-col gap-1">
        <h2 class="text-lg font-semibold text-slate-900">Data Quality</h2>
        <p class="text-sm text-slate-500">Optional item fields filled in across the selected scope.</p>
    </div>

    <div class="mt-5 grid gap-4 sm:grid-cols-2 xl:grid-cols-4">
        @for (metric of metrics(); track metric.label) {
            <article class="rounded-lg border border-slate-200 bg-slate-50 p-4">
                <div class="text-sm font-medium text-slate-900">{{ metric.label }}</div>
                <div class="mt-2 text-2xl font-semibold text-slate-900">{{ metric.completionRate * 100 | number:'1.0-0' }}%</div>
                <div class="mt-2 text-sm text-slate-500">{{ metric.filledCount }} of {{ metric.totalCount }} items</div>
            </article>
        }
    </div>
</section>
