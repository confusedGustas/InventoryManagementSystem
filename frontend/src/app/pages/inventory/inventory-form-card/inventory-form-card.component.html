<article class="rounded-lg border border-slate-200 bg-white p-6">
    <div class="text-base font-semibold text-slate-900">{{ editingInventoryId() ? 'Edit Inventory' : 'Create Inventory' }}</div>
    <form class="mt-5 grid gap-4 md:grid-cols-2" [formGroup]="inventoryForm()" (ngSubmit)="submitted.emit()">
        <label class="block">
            <span class="mb-1.5 block text-sm text-slate-700">Inventory Name</span>
            <input formControlName="name" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 outline-none transition focus:border-indigo-700 focus:ring-2 focus:ring-slate-100" />
        </label>

        <label class="block">
            <span class="mb-1.5 block text-sm text-slate-700">Inventory Code</span>
            <input formControlName="code" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 outline-none transition focus:border-indigo-700 focus:ring-2 focus:ring-slate-100" />
        </label>

        @if (!isCompanyAdmin()) {
            <label class="block">
                <span class="mb-1.5 block text-sm text-slate-700">Company</span>
                <div class="relative">
                    <select formControlName="companyId" class="w-full appearance-none rounded-lg border border-slate-300 bg-white px-3 py-2 pr-10 text-sm text-slate-900 outline-none transition focus:border-indigo-700 focus:ring-2 focus:ring-slate-100">
                        <option value="">Select company</option>
                        @for (company of companies(); track company.id) {
                            <option [value]="company.id">{{ company.name }}</option>
                        }
                    </select>
                    <span class="pointer-events-none absolute inset-y-0 right-3 flex items-center text-slate-400">
                        <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 0 1 1.06.02L10 11.168l3.71-3.938a.75.75 0 1 1 1.08 1.04l-4.25 4.512a.75.75 0 0 1-1.08 0L5.21 8.27a.75.75 0 0 1 .02-1.06Z" clip-rule="evenodd" /></svg>
                    </span>
                </div>
            </label>
        }

        <label class="block">
            <span class="mb-1.5 block text-sm text-slate-700">Location</span>
            <div class="relative">
                <select formControlName="locationId" class="w-full appearance-none rounded-lg border border-slate-300 bg-white px-3 py-2 pr-10 text-sm text-slate-900 outline-none transition focus:border-indigo-700 focus:ring-2 focus:ring-slate-100">
                    <option value="">No location</option>
                    @for (location of availableLocations(); track location.id) {
                        <option [value]="location.id">{{ location.name }}</option>
                    }
                </select>
                <span class="pointer-events-none absolute inset-y-0 right-3 flex items-center text-slate-400">
                    <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 0 1 1.06.02L10 11.168l3.71-3.938a.75.75 0 1 1 1.08 1.04l-4.25 4.512a.75.75 0 0 1-1.08 0L5.21 8.27a.75.75 0 0 1 .02-1.06Z" clip-rule="evenodd" /></svg>
                </span>
            </div>
        </label>

        <label class="block md:col-span-2">
            <span class="mb-1.5 block text-sm text-slate-700">Description</span>
            <textarea formControlName="description" rows="3" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 outline-none transition focus:border-indigo-700 focus:ring-2 focus:ring-slate-100"></textarea>
        </label>

        <div class="md:col-span-2">
            <button type="submit" class="rounded-lg bg-indigo-700 px-4 py-2 text-sm font-medium text-white transition hover:bg-indigo-600">
                {{ editingInventoryId() ? 'Update Inventory' : 'Save Inventory' }}
            </button>
        </div>
    </form>
</article>
