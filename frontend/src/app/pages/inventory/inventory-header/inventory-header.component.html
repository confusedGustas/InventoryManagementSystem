<div class="rounded-lg border border-slate-200 bg-white p-6">
    <div class="flex flex-col gap-4 md:flex-row md:items-end md:justify-between">
        <div>
            <h1 class="mt-3 text-3xl font-semibold text-slate-900">Inventory</h1>
            <p class="mt-2 text-sm text-slate-500">Manage inventories and the items stored inside them.</p>
        </div>
        <div class="flex flex-wrap gap-2">
            @if (canManageInventories()) {
                <button type="button" class="rounded-lg bg-indigo-700 px-4 py-2 text-sm font-medium text-white transition hover:bg-indigo-600" (click)="inventoryFormToggled.emit()">
                    {{ showInventoryForm() ? 'Close Inventory Form' : 'New Inventory' }}
                </button>
            }
            <button type="button" class="rounded-lg border border-slate-200 px-4 py-2 text-sm font-medium text-slate-700 transition hover:border-slate-300 hover:text-slate-900" (click)="itemFormToggled.emit()">
                {{ showItemForm() ? 'Close Item Form' : 'New Item' }}
            </button>
        </div>
    </div>
</div>
