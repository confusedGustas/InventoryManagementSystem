<article class="h-full rounded-xl border border-slate-200 bg-white p-6 mt-6">
    <div class="flex items-start justify-between gap-4">
        <div>
            <div class="text-base font-semibold text-slate-900">Profile Details</div>
        </div>
        <span class="text-sm font-medium" [class.text-emerald-600]="profile().enabled" [class.text-red-600]="!profile().enabled">
            {{ profile().enabled ? 'Enabled' : 'Disabled' }}
        </span>
    </div>
    <div class="mt-5 grid gap-5 md:grid-cols-3">
        <div>
            <div class="text-xs font-medium uppercase tracking-widest text-slate-400">First Name</div>
            <div class="mt-1 text-sm font-medium text-slate-900">{{ profile().firstName }}</div>
        </div>
        <div>
            <div class="text-xs font-medium uppercase tracking-widest text-slate-400">Last Name</div>
            <div class="mt-1 text-sm font-medium text-slate-900">{{ profile().lastName }}</div>
        </div>
        <div>
            <div class="text-xs font-medium uppercase tracking-widest text-slate-400">Username</div>
            <div class="mt-1 text-sm font-medium text-slate-900">{{ profile().username }}</div>
        </div>
    </div>
</article>
