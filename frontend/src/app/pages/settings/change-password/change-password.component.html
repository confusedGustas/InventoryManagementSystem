<div class="w-full flex flex-col rounded-xl border border-slate-200 bg-white p-6">
    <div class="text-base font-semibold text-slate-900">Change Password</div>
    <div class="mt-0.5 text-sm text-slate-500">Use your current password to set a new one.</div>
    <form class="mt-5 flex flex-1 flex-col justify-between gap-4" [formGroup]="form" (ngSubmit)="submit()">
        <div class="space-y-4">
            <label class="block">
                <span class="mb-1.5 block text-sm text-slate-700">Current Password</span>
                <input type="password" formControlName="currentPassword" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 outline-none transition focus:border-indigo-700 focus:ring-2 focus:ring-slate-100" />
            </label>
            <label class="block">
                <span class="mb-1.5 block text-sm text-slate-700">New Password</span>
                <input type="password" formControlName="newPassword" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 outline-none transition focus:border-indigo-700 focus:ring-2 focus:ring-slate-100" />
            </label>
        </div>
        <button type="submit" class="rounded-lg bg-indigo-700 px-4 py-2 text-sm font-medium text-white transition hover:bg-indigo-600">
            Update Password
        </button>
    </form>
</div>
