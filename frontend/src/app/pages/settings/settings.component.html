@if (profile(); as user) {
    <section class="space-y-6">
        <app-user-banner [firstName]="user.firstName" [lastName]="user.lastName" [createdOn]="user.createdOn"/>
        <app-profile-details [profile]="user"/>
        @if (showApiKey()) {
            @if (companyApiKey(); as companyApiKey) {
                <app-api-key
                    [apiKey]="companyApiKey.apiKey"
                    [companyName]="companyApiKey.companyName"
                    [updatedOn]="companyApiKey.updatedOn"
                    (apiKeySaved)="updateCompanyApiKey($event)"
                />
            }
        }
        <div class="grid grid-cols-2 gap-6">
            <app-change-email class="flex" [email]="user.email" (profileUpdated)="updateProfile($event)"/>
            <app-change-password class="flex" />
        </div>
        <div class="rounded-xl border border-slate-200 bg-white p-6 flex items-center justify-between">
            <div>
                <div class="text-base font-semibold text-slate-900">Logout</div>
                <div class="mt-0.5 text-sm text-slate-500">End your current session on this device.</div>
            </div>
            <button type="button" class="rounded-lg bg-red-600 px-5 py-3 text-sm font-semibold text-white transition hover:bg-red-500" (click)="logout()">
                Logout
            </button>
        </div>
    </section>
}
