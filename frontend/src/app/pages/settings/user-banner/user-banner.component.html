<section class="rounded-xl border border-slate-200 bg-white p-6 xl:col-span-2">
    <div class="flex items-center justify-between gap-4">
        <div class="flex items-center gap-4">
            <app-initial [firstName]="firstName()" [lastName]="lastName()"></app-initial>
            <div>
                <h1 class="text-xl font-semibold text-slate-900">{{ firstName() }} {{ lastName() }}</h1>
            </div>
        </div>
        <div class="flex items-center gap-2 text-sm text-slate-500">
            <span>Joined {{ createdOn() | date: 'MMM d y' }}</span>
        </div>
    </div>
</section>
