<article class="w-full flex flex-col rounded-xl border border-slate-200 bg-white p-6">
    <div class="text-base font-semibold text-slate-900">Change Email</div>
    <div class="mt-0.5 text-sm text-slate-500">Update the email address attached to your account.</div>
    <form class="mt-5 flex flex-1 flex-col justify-between gap-4" [formGroup]="form" (ngSubmit)="submit()">
        <label class="block">
            <span class="mb-1.5 block text-sm text-slate-700">Email</span>
            <input formControlName="email" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 outline-none transition focus:border-indigo-700 focus:ring-2 focus:ring-slate-100" />
        </label>
        <button type="submit" class="rounded-lg bg-indigo-700 px-4 py-2 text-sm font-medium text-white transition hover:bg-indigo-600">
            Save Email
        </button>
    </form>
</article>
