<article class="w-full rounded-xl border border-slate-200 bg-white p-6 mt-6">
    <div class="flex items-start justify-between gap-4">
        <div>
            <div class="text-base font-semibold text-slate-900">AI API Key</div>
            <div class="mt-0.5 text-sm text-slate-500">Store the API key used by {{ companyName() || 'your admin account' }} AI integrations.</div>
        </div>
        @if (updatedOn()) {
            <div class="text-right text-xs text-slate-400">
                <div class="font-medium uppercase tracking-widest">Updated</div>
                <div class="mt-1 normal-case tracking-normal text-slate-500">{{ updatedOn() | date:'MMM d, y, HH:mm' }}</div>
            </div>
        }
    </div>

    <form class="mt-5 flex flex-col gap-4" [formGroup]="form" (ngSubmit)="submit()">
        <label class="block">
            <span class="mb-1.5 block text-sm text-slate-700">API Key</span>
            <textarea
                formControlName="apiKey"
                rows="4"
                class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 outline-none transition focus:border-indigo-700 focus:ring-2 focus:ring-slate-100"
            ></textarea>
        </label>

        <div class="flex justify-end">
            <button type="submit" class="rounded-lg bg-indigo-700 px-4 py-2 text-sm font-medium text-white transition hover:bg-indigo-600">
                Save API Key
            </button>
        </div>
    </form>
</article>
