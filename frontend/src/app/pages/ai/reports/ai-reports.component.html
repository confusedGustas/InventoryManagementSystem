<section class="rounded-lg border border-slate-200 bg-white p-4 sm:p-6">
    <div class="flex items-start justify-between gap-4">
        <div>
            <h2 class="text-lg font-semibold text-slate-900">Saved Reports</h2>
            <p class="mt-1 text-sm text-slate-500">Recent AI analyses stored in the database and ready for PDF download.</p>
        </div>
    </div>

    <div class="mt-5 space-y-3">
        @for (report of reports(); track report.id) {
            <article class="rounded-lg border border-slate-200 bg-slate-50 p-4">
                <div class="flex flex-col gap-3 md:flex-row md:items-start md:justify-between">
                    <div class="min-w-0 flex-1">
                        <div class="text-sm font-semibold text-slate-900">{{ report.scopeLabel }}</div>
                        <div class="mt-1 text-xs text-slate-500">{{ report.generatedOn | date:'MMM d, y, HH:mm' }}</div>
                        <p class="mt-2 text-sm text-slate-600">{{ report.overview }}</p>
                    </div>
                    <div class="flex justify-center md:pt-3 md:w-40 md:flex-none">
                        <button
                            type="button"
                            class="inline-flex min-h-11 w-full items-center justify-center rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 transition hover:border-slate-400 hover:text-slate-900 disabled:cursor-not-allowed disabled:opacity-60"
                            [disabled]="loading()"
                            (click)="reportDownloaded.emit(report.id)"
                        >
                            Download PDF
                        </button>
                    </div>
                </div>
            </article>
        } @empty {
            <div class="text-sm text-slate-500">No saved AI reports yet.</div>
        }
    </div>
</section>
