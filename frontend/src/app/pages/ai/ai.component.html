<section class="mx-auto px-4 py-6 sm:px-6">
    <div class="rounded-lg border border-slate-200 bg-white p-4 sm:p-6 mb-6">
        <div class="flex flex-col gap-3 md:flex-row md:items-end md:justify-between">
            <div>
                <h1 class="text-2xl font-semibold text-slate-900 sm:text-3xl">AI</h1>
                <p class="mt-1 text-sm text-slate-500">Generate a short strategic inventory review using the configured company OpenAI API key.</p>
            </div>
            <app-ai-company-filter
                class="block"
                [isPlatformAdmin]="isPlatformAdmin"
                [companies]="scope()?.companies ?? []"
                [selectedCompanyId]="selectedCompanyId()"
                (companySelected)="selectCompany($event)"
            />
        </div>
    </div>

    <app-ai-analysis-request
        class="block mb-6"
        [scopeLabel]="scopeLabel()"
        [loading]="loading()"
        (analyzeRequested)="runAnalysis()"
    />

    <app-ai-image-suggestion
        class="block mb-6"
        [loading]="itemSuggestionLoading()"
        [scopeLabel]="scopeLabel()"
        (imageSelected)="suggestItemFromImage($event)"
    />

    <app-ai-item-creation
        class="block mb-6"
        [suggestion]="itemSuggestion()"
        (itemSaved)="clearItemSuggestion()"
    />

    <app-ai-analysis-result
        class="block mb-6"
        [analysis]="analysis()"
        [loading]="loading()"
        (pdfRequested)="downloadReportPdf($event)"
    />

    <app-ai-reports
        class="block mb-6"
        [reports]="reports()"
        [loading]="loading()"
        (reportDownloaded)="downloadReportPdf($event)"
    />
</section>
