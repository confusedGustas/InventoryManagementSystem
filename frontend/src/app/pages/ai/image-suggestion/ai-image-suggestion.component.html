<section class="rounded-lg border border-slate-200 bg-white p-4 sm:p-6">
    <div class="flex flex-col gap-2">
        <h2 class="text-lg font-semibold text-slate-900">Create Item From Image</h2>
        <p class="text-sm text-slate-500">Upload a product photo for {{ scopeLabel() }} and AI will prepare a draft item for you.</p>
    </div>

    <div class="mt-5 flex flex-col gap-3 sm:flex-row sm:items-center">
        <label class="inline-flex cursor-pointer items-center justify-center rounded-lg bg-indigo-700 px-4 py-2 text-sm font-medium text-white transition hover:bg-indigo-600">
            {{ loading() ? 'Analyzing...' : 'Upload Image' }}
            <input type="file" accept="image/*" class="hidden" [disabled]="loading()" (change)="onFileChange($event)" />
        </label>

        @if (fileName()) {
            <div class="text-sm text-slate-500">{{ fileName() }}</div>
        }
    </div>
</section>
