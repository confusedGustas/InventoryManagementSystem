@if (suggestion(); as currentSuggestion) {
    <section class="rounded-lg border border-slate-200 bg-white p-4 sm:p-6">
        <div class="flex flex-col gap-2">
            <h2 class="text-lg font-semibold text-slate-900">Suggested Item Draft</h2>
            <p class="text-sm text-slate-500">{{ currentSuggestion.imageSummary }}</p>
        </div>

        <label class="mt-5 block max-w-md">
            <span class="mb-1.5 block text-sm text-slate-700">Inventory</span>
            <select
                class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 outline-none transition focus:border-indigo-700 focus:ring-2 focus:ring-slate-100"
                [value]="selectedInventoryId() ?? ''"
                (change)="selectInventory($any($event.target).value)"
            >
                <option value="">Select inventory</option>
                @for (inventory of inventoryOptions(); track inventory.id) {
                    <option [value]="inventory.id">{{ inventory.companyName }} · {{ inventory.name }}{{ inventory.locationName ? ' · ' + inventory.locationName : '' }}</option>
                }
            </select>
        </label>

        <div class="mt-5">
            <app-item-form-card
                [editingItemId]="null"
                [itemForm]="itemForm"
                [selectedInventory]="selectedInventory()"
                (submitted)="saveItem()"
            />
        </div>
    </section>
}
