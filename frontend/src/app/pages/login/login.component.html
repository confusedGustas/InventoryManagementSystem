<section class="flex min-h-screen items-center justify-center bg-slate-100 px-6">
    <div class="w-full max-w-lg rounded-3xl bg-white p-8 shadow-lg shadow-slate-300/50">
        <p class="text-sm font-medium uppercase tracking-[0.3em] text-slate-500">Inventory Management</p>
        <h1 class="mt-3 text-3xl font-semibold text-slate-900">Sign in</h1>
        <p class="mt-2 text-sm text-slate-600">Sign in with your username and password.</p>

        <div class="mt-6 grid grid-cols-2 rounded-2xl bg-slate-100 p-1">
            <div class="rounded-xl bg-white px-4 py-2 text-center text-sm font-medium text-slate-900">
                Login
            </div>
            <a
                routerLink="/register"
                class="rounded-xl px-4 py-2 text-center text-sm font-medium text-slate-500 transition">
                Register
            </a>
        </div>

        <form class="mt-6 space-y-4" [formGroup]="loginForm" (ngSubmit)="submit()">
            <label class="block">
                <span class="mb-1 block text-sm font-medium text-slate-700">Username</span>
                <input class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none transition focus:border-indigo-500" formControlName="username" />
            </label>

            <label class="block">
                <span class="mb-1 block text-sm font-medium text-slate-700">Password</span>
                <input type="password" class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none transition focus:border-indigo-500" formControlName="password" />
            </label>

            <button type="submit" class="w-full rounded-xl bg-indigo-700 px-4 py-3 text-sm font-semibold text-white transition hover:bg-indigo-600 disabled:cursor-not-allowed disabled:opacity-70">
                Sign in
            </button>
        </form>
    </div>
</section>
